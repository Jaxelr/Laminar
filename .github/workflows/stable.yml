name: Publish stable

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.release.prerelease == false && !contains(github.event.release.tag_name, '-')
    uses: ./.github/workflows/build.yml

  publish:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Set package version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Stable release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0."
          }
          "version=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_OUTPUT
      - name: Pack
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src\Laminar\Laminar.csproj --configuration Release --output artifacts --warnaserror -p:Version=$env:PACKAGE_VERSION -p:ContinuousIntegrationBuild=true
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to nuget.org
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts\Laminar.$env:PACKAGE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
