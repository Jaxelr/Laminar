name: Publish stable

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.release.prerelease == false && !contains(github.event.release.tag_name, '-')
    uses: ./.github/workflows/build.yml

  publish:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Stable release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0."
          }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          dotnet pack src\Laminar\Laminar.csproj --configuration Release --output artifacts --warnaserror -p:Version=$version -p:ContinuousIntegrationBuild=true
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts\*.nupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
      - name: Publish to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $source = "https://nuget.pkg.github.com/$env:GITHUB_REPOSITORY_OWNER/index.json"
          $env:NuGetPackageSourceCredentials_github = "Username=$env:GITHUB_REPOSITORY_OWNER;Password=$env:NUGET_API_KEY;ValidAuthenticationTypes=Basic"
          dotnet nuget add source $source --name github && dotnet nuget push "artifacts\*.nupkg" --source github --api-key $env:NUGET_API_KEY --skip-duplicate
