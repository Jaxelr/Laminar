name: Publish prerelease

on:
  push:
    tags: ['v*-*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/build.yml

  publish:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set package version
        id: version
        shell: pwsh
        run: '"version=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_OUTPUT'
      - name: Pack
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src\Laminar\Laminar.csproj --configuration Release --output artifacts --warnaserror -p:Version=$env:PACKAGE_VERSION -p:ContinuousIntegrationBuild=true
      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = "artifacts\Laminar.$env:PACKAGE_VERSION.nupkg"
          $source = "https://nuget.pkg.github.com/$env:GITHUB_REPOSITORY_OWNER/index.json"
          $env:NuGetPackageSourceCredentials_github = "Username=$env:GITHUB_REPOSITORY_OWNER;Password=$env:NUGET_API_KEY;ValidAuthenticationTypes=Basic"
          dotnet nuget add source $source --name github && dotnet nuget push $package --source github --api-key $env:NUGET_API_KEY
